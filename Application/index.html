<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgendaWeb — Your Cultural Web Feed</title>
  <meta name="description" content="Open-web, decentralized cultural calendar and editorial magazine reader for Australia.">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1B3B2B">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Brand Header -->
  <header>
    <a href="#" class="brand">
      <img src="assets/logo.svg" alt="AgendaWeb">
    </a>
    <div class="header-actions">
      <span class="clean-mode-badge" id="clean-mode-indicator">✦ Open Broadsheet</span>
      <button class="icon-btn" onclick="toggleSettingsModal()">⚙ Settings</button>
    </div>
  </header>

  <!-- 5-Channel Tab Navigation -->
  <nav class="tabs" id="main-tabs">
    <button class="tab-btn active" data-tab="events" onclick="setTab('events')">⚡ Events</button>
    <button class="tab-btn tab-news" data-tab="news" onclick="setTab('news')">📰 News</button>
    <button class="tab-btn tab-politics" data-tab="politics" onclick="setTab('politics')">🏛 Politics</button>
    <button class="tab-btn tab-culture" data-tab="culture" onclick="setTab('culture')">🎨 Culture</button>
    <button class="tab-btn" data-tab="reads" onclick="setTab('reads')">🔖 Reads</button>
  </nav>

  <!-- Event Sub-Category Filters -->
  <div class="sub-filter" id="sub-filter">
    <button class="filter-pill active" onclick="setFilter('All', this)">All</button>
    <button class="filter-pill" onclick="setFilter('Live Music', this)">Live Music</button>
    <button class="filter-pill" onclick="setFilter('Art', this)">Art & Fair</button>
    <button class="filter-pill" onclick="setFilter('Community', this)">Community</button>
  </div>

  <!-- Dynamic Broadsheet Feed -->
  <main class="feed-container" id="feed">
    <div class="state-message">Loading cultural feed...</div>
  </main>

  <!-- Settings & Customization Modal -->
  <div class="modal-overlay" id="settings-modal" onclick="if(event.target===this) toggleSettingsModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Reader Preferences</h3>
        <button class="icon-btn" onclick="toggleSettingsModal()">✕</button>
      </div>
      <div class="setting-row">
        <div class="setting-label">
          <h4>Clean Mode</h4>
          <p>Hide news and politics tabs; run as an exclusive gig & cultural event guide.</p>
        </div>
        <input type="checkbox" id="clean-mode-check" onchange="toggleCleanMode(this)">
      </div>
      <div class="setting-row" style="border:none; padding-top:16px;">
        <div class="setting-label">
          <h4>Local Data Storage</h4>
          <p>All bookmarks, saved reads, and preferences are stored exclusively on this device.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modular Scripts -->
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
