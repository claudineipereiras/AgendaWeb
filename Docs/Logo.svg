<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" width="1020" height="480" fill="none">
  <!-- AgendaWeb Official Brand Logo - Updated per stitch_agendaweb_brand_logo_system03 with +25% Brand Name & Slogan -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;display=swap');
      .brand-text {
        fill: #1B3B2B;
      }
      @media (prefers-color-scheme: dark) {
        .brand-text {
          fill: #F7F5F0;
        }
      }
    </style>
  </defs>

  <g id="logo-mark" transform="translate(40, 50)">
    <!-- Outer RSS wave arc in Sage Green (#4A5D4E) -->
    <path d="M 170 -26 A 166 166 0 0 1 336 140" fill="none" stroke="#4A5D4E" stroke-width="20" stroke-linecap="round" />
    
    <!-- Inner RSS wave arc in Sage Green (#4A5D4E) -->
    <path d="M 170 20 A 120 120 0 0 1 290 140" fill="none" stroke="#4A5D4E" stroke-width="20" stroke-linecap="round" />

    <!-- Bookmark Ribbon in Amber Rust (#C85A32) -->
    <path d="M 20 65 L 170 65 A 75 75 0 0 1 245 140 L 245 410 L 132.5 330 L 20 410 Z" fill="#C85A32" />

    <!-- Calendar Container: Nightfall plate (#1B3B2B) - bottom at y = 290 -->
    <rect x="52" y="116" width="162" height="174" rx="20" fill="#1B3B2B" />

    <!-- Chalk Calendar inner faceplate -->
    <rect x="62" y="150" width="142" height="130" rx="6" fill="#F7F5F0" />

    <!-- Dual binder rings -->
    <rect x="88" y="98" width="16" height="32" rx="8" fill="#F7F5F0" />
    <rect x="93" y="103" width="6" height="22" rx="3" fill="#1B3B2B" />

    <rect x="162" y="98" width="16" height="32" rx="8" fill="#F7F5F0" />
    <rect x="167" y="103" width="6" height="22" rx="3" fill="#1B3B2B" />

    <!-- Calendar Grid (7-block editorial layout: 2 in row 1, 3 in row 2, 2 in row 3) -->
    <!-- Row 1 -->
    <rect x="119" y="164" width="28" height="24" rx="3" fill="#1B3B2B" />
    <rect x="162" y="164" width="28" height="24" rx="3" fill="#1B3B2B" />
    <!-- Row 2 -->
    <rect x="76" y="200" width="28" height="24" rx="3" fill="#1B3B2B" />
    <rect x="119" y="200" width="28" height="24" rx="3" fill="#1B3B2B" />
    <rect x="162" y="200" width="28" height="24" rx="3" fill="#1B3B2B" />
    <!-- Row 3 -->
    <rect x="76" y="236" width="28" height="24" rx="3" fill="#1B3B2B" />
    <rect x="119" y="236" width="28" height="24" rx="3" fill="#1B3B2B" />
  </g>

  <!-- Typography Block: Placed under the rounded RSS lines, with bottom baseline aligning with calendar bottom -->
  <!-- "AGENDA" in Bold 900 and "WEB" in Regular 400 (Font-size: 100, +25% from 80) -->
  <!-- Slogan: "YOUR CULTURAL WEB FEED" (Font-size: 31.25, +25% from 25) -->
  <g id="logo-text">
    <text x="315" y="292" 
          font-family="system-ui, -apple-system, 'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-size="100" 
          letter-spacing="1.5" 
          class="brand-text"
          fill="#1B3B2B"><tspan font-weight="900">AGENDA</tspan><tspan font-weight="400">WEB</tspan></text>
    <text x="318" y="342" 
          font-family="system-ui, -apple-system, 'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-size="31.25" 
          font-weight="700" 
          letter-spacing="2.8" 
          class="brand-text"
          fill="#1B3B2B">YOUR CULTURAL WEB FEED</text>
  </g>
</svg>
