<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 5 960 380" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Inter:wght@700;800&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 102px;
        font-weight: 800;
        fill: #1B3B2B;
        letter-spacing: 0.025em;
      }
      .brand-slogan {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 42px;
        font-weight: 800;
        fill: #1B3B2B;
        letter-spacing: 0.08em;
      }
    </style>
  </defs>

  <!-- ==================== EMBLEM ==================== -->
  <g id="emblem">
    <!-- RSS Waves (Top Right of Ribbon, Sage Green #4A5D4E) -->
    <g stroke="#4A5D4E" stroke-width="16" stroke-linecap="round">
      <!-- Inner Arc (Radius ~65) -->
      <path d="M 160 52 A 65 65 0 0 1 225 117" />
      <!-- Outer Arc (Radius ~104) -->
      <path d="M 160 13 A 104 104 0 0 1 264 117" />
    </g>

    <!-- Bookmark Ribbon (Amber Rust #C85A32) -->
    <!-- Square top-left, large rounded top-right shoulder, clean V-notch bottom -->
    <path d="M 40 75 H 160 A 55 55 0 0 1 215 130 V 380 L 127.5 330 L 40 380 Z" fill="#C85A32" />

    <!-- Calendar Outer Body (Nightfall Green #1B3B2B with rounded corners) -->
    <rect x="63" y="142" width="129" height="152" rx="12" fill="#1B3B2B" />

    <!-- Calendar Inner Plate (Chalk #F7F5F0) -->
    <rect x="70" y="174" width="115" height="113" rx="6" fill="#F7F5F0" />

    <!-- Top Binder Rings (Chalk #F7F5F0 loops with Nightfall #1B3B2B interior) -->
    <rect x="85" y="125" width="16" height="34" rx="8" fill="#1B3B2B" stroke="#F7F5F0" stroke-width="3.5" />
    <rect x="154" y="125" width="16" height="34" rx="8" fill="#1B3B2B" stroke="#F7F5F0" stroke-width="3.5" />

    <!-- Calendar Grid: 7 Asymmetrical Blocks in Nightfall #1B3B2B -->
    <!-- Arranged in 3 columns: Left (2), Center (3), Right (2) -->
    <g fill="#1B3B2B">
      <!-- Row 1: Col 1 is empty -->
      <rect x="116" y="186" width="23" height="23" rx="3" />
      <rect x="152" y="186" width="23" height="23" rx="3" />

      <!-- Row 2: Col 1, Col 2, Col 3 are filled -->
      <rect x="80" y="219" width="23" height="23" rx="3" />
      <rect x="116" y="219" width="23" height="23" rx="3" />
      <rect x="152" y="219" width="23" height="23" rx="3" />

      <!-- Row 3: Col 1, Col 2 are filled; Col 3 is empty -->
      <rect x="80" y="252" width="23" height="23" rx="3" />
      <rect x="116" y="252" width="23" height="23" rx="3" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <!-- Centered horizontally under the text lockup, vertically centered relative to emblem -->
  <g id="typography" text-anchor="middle">
    <!-- Brand Title -->
    <text x="625" y="208" class="brand-title">AGENDAWEB</text>
    <!-- Brand Slogan -->
    <text x="625" y="264" class="brand-slogan">YOUR CULTURAL WEB FEED</text>
  </g>
</svg>